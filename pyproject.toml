[project]
name = "topology-design"
version = "0.1.0"
description = "Phase 0 theory fixtures for how parameter-free network topology shapes learning dynamics"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: longer training runs (deselect with -m 'not slow')"]
